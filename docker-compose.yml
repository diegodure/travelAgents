services:
  wppconnect:
    image: mi-wppconnect:local
    container_name: wppconnect_server
    network_mode: "host"
    volumes:
      - ./config.json:/home/node/app/config.json
      - ./config.json:/home/node/app/dist/config.json
      - ./userDataDir:/home/node/app/userDataDir
    environment:
      - VIEW_QR_CONSOLE=true